<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de IA — Resumo Diário</title>
<style>
  :root {
    --bg: #0b0d12; --card: #141824; --border: #232838;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #6ea8fe; --accent2: #34d399;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 32px 24px 16px; border-bottom: 1px solid var(--border); text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .stats { display: flex; gap: 16px; padding: 20px 24px; flex-wrap: wrap; justify-content: center; max-width: 900px; margin: 0 auto; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 22px; min-width: 150px; text-align: center;
  }
  .stat .num { font-size: 30px; font-weight: 700; color: var(--accent); }
  .stat .label { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 24px 20px; justify-content: center; }
  .chip {
    padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; transition: 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
  main { padding: 0 24px 50px; max-width: 820px; margin: 0 auto; }
  .day-group { margin-bottom: 32px; }
  .day-title {
    font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 12px; border-bottom: 1px solid var(--border);
    padding-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .card a.title { color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; line-height: 1.4; }
  .card a.title:hover { color: var(--accent); }
  .card .summary { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-top: 4px; }
  .badge {
    font-size: 11px; padding: 4px 11px; border-radius: 999px; white-space: nowrap;
    background: #1c2333; color: var(--accent); border: 1px solid var(--border); flex-shrink: 0;
  }
  .badge.paper { color: var(--accent2); }
  .empty { color: var(--muted); padding: 60px 20px; text-align: center; font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
  .show-more { text-align: center; margin-top: 8px; }
  .show-more button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 8px 18px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .show-more button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🛰️ Radar de Lançamentos de IA</h1>
  <p>O que há de novo no mundo da inteligência artificial, todos os dias.</p>
</header>

<div class="stats" id="stats"></div>
<div class="controls" id="filters"></div>
<main id="main"><div class="empty">Carregando…</div></main>
<footer>Atualizado automaticamente todos os dias · Fontes: OpenAI, Anthropic, Google, Meta, Mistral, DeepMind, Hugging Face, arXiv</footer>

<script>
let activeFilter = "Lançamentos";
let expandedDays = {};

const DAY_NAMES = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function formatDayLabel(dateStr) {
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const yestStr = yest.toISOString().slice(0, 10);
  if (dateStr === todayStr) return "Hoje";
  if (dateStr === yestStr) return "Ontem";
  const d = new Date(dateStr + "T00:00:00Z");
  return `${DAY_NAMES[d.getUTCDay()]}, ${d.getUTCDate()}/${d.getUTCMonth() + 1}`;
}

async function loadData() {
  try {
    const res = await fetch("data/history.json?_=" + Date.now());
    const history = await res.json();
    render(history);
  } catch (e) {
    document.getElementById("main").innerHTML = '<div class="empty">Ainda não há dados. Aguarde a primeira execução automática. 🕓</div>';
  }
}

function render(history) {
  const sorted = [...history].sort((a, b) => (a.date < b.date ? 1 : -1));
  const allItems = sorted.flatMap(d => d.items.map(it => ({...it, date: d.date})));

  const filterGroups = {
    "Lançamentos": it => it.category === "release" || it.category === "model_upload",
    "Pesquisas": it => it.category === "paper",
    "Tudo": () => true,
  };

  const filtersEl = document.getElementById("filters");
  filtersEl.innerHTML = "";
  Object.keys(filterGroups).forEach(name => {
    const chip = document.createElement("div");
    chip.className = "chip" + (name === activeFilter ? " active" : "");
    chip.textContent = name;
    chip.onclick = () => { activeFilter = name; render(history); };
    filtersEl.appendChild(chip);
  });

  const filtered = allItems.filter(filterGroups[activeFilter]);

  const releasesLast7 = sorted.slice(0, 7).flatMap(d => d.items)
    .filter(it => it.category === "release" || it.category === "model_upload").length;
  const todayReleases = (sorted[0]?.items || [])
    .filter(it => it.category === "release" || it.category === "model_upload").length;
  const sources = new Set(allItems.map(i => i.source));

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${todayReleases}</div><div class="label">Novidades hoje</div></div>
    <div class="stat"><div class="num">${releasesLast7}</div><div class="label">Últimos 7 dias</div></div>
    <div class="stat"><div class="num">${sources.size}</div><div class="label">Fontes monitoradas</div></div>
  `;

  const byDate = {};
  filtered.forEach(it => { (byDate[it.date] = byDate[it.date] || []).push(it); });

  const main = document.getElementById("main");
  const dates = Object.keys(byDate).sort().reverse();
  if (!dates.length) {
    main.innerHTML = '<div class="empty">Nenhum item encontrado para este filtro.</div>';
    return;
  }

  main.innerHTML = dates.map(date => {
    const items = byDate[date];
    const limit = activeFilter === "Pesquisas" ? 5 : items.length;
    const expanded = expandedDays[date];
    const visible = expanded ? items : items.slice(0, limit);
    const hasMore = items.length > limit;

    return `
    <div class="day-group">
      <div class="day-title">📅 ${formatDayLabel(date)} · ${items.length} ${items.length === 1 ? 'item' : 'itens'}</div>
      ${visible.map(it => `
        <div class="card">
          <div class="card-top">
            <a class="title" href="${it.link}" target="_blank" rel="noopener">${it.title}</a>
            <span class="badge ${it.category === 'paper' ? 'paper' : ''}">${it.source}</span>
          </div>
          ${it.summary ? `<div class="summary">${it.summary}</div>` : ""}
        </div>
      `).join("")}
      ${hasMore ? `
        <div class="show-more">
          <button onclick="expandedDays['${date}']=true; render(window.__history)">
            Mostrar mais ${items.length - limit} itens
          </button>
        </div>
      ` : ""}
    </div>
  `;
  }).join("");

  window.__history = history;
}

loadData();
</script>
</body>
</html>
